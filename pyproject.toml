[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-ai-performance-engineering"
version = "0.1.0"
description = "Reproducible benchmark framework for distributed transformer training and inference on H100 systems."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.26,<3",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
]
yaml = ["PyYAML>=6.0"]
workloads = [
    "datasets>=2.20,<5",
    "torch>=2.8,<2.9",
    "transformers>=4.44,<5",
]
distributed = ["deepspeed>=0.18.9,<0.20"]
# vLLM wheels are tightly coupled to the active CUDA/PyTorch/driver ABI.
# Install or build vLLM separately for the target cluster stack before running serving rows.
serving = []

[project.scripts]
hpc-ai-run = "hpc_ai_perf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = []
extend-ignore = [
    "B024", # Base classes are used as lightweight extension interfaces.
    "B027", # Some hooks intentionally default to no-op implementations.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
