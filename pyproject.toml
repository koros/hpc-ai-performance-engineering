[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-ai-performance-engineering"
version = "0.1.0"
description = "Reproducible benchmark framework for distributed transformer training and inference on H100 systems."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
yaml = ["PyYAML>=6.0"]

[project.scripts]
hpc-ai-run = "hpc_ai_perf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

