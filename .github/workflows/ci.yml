name: Validate project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  torch-cpu-tests:
    name: Validate optional PyTorch paths on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install CPU-only PyTorch matching the HPC version
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Require a working CPU-only PyTorch installation
        run: |
          python - <<'PY'
          import torch

          assert torch.__version__.split("+")[0] == "2.8.0", torch.__version__
          assert torch.version.cuda is None, "CI must use the CPU-only PyTorch wheel"
          print(f"Validated PyTorch {torch.__version__} on CPU")
          PY

      - name: Run Python tests including optional PyTorch coverage
        run: python -m pytest

      - name: Set up Node.js for dashboard tests
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate lint, dashboard, configuration and evidence
        run: |
          make lint
          python scripts/check_publication_paths.py
          make test-dashboard
          make validate
          make validate-result-evidence
          make refresh
          make check-dashboard-data
